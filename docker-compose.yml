services:
  jd-monitor:
    build: .
    container_name: jd-monitor
    ports:
      - "8080:8080"
    environment:
      JD_MONITOR_DATA_DIR: /data
      MYJD_EMAIL: me@example.com
      MYJD_PASSWORD: change-me
      MYJD_DEVICES: HomeJD,ServerJD
      WEBHOOK_URL: https://discord.com/api/webhooks/xxx/yyy
      LANG: en
      INTERVAL: "300"
    volumes:
      - ./data:/data
    restart: unless-stopped
